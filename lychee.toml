root_dir = "dist/"
# Sites that block automated checkers, so a failure says nothing about the link:
# - ico.org.uk rate-limits/blocks automated checkers (observed timing out in a
#   real browser from this machine too). The canonical regulator URL in the
#   privacy policy is correct.
# - Stock photo sites behind bot protection answer CI runners with 401/403
#   (Unsplash via a /.within.website challenge, Pexels via Cloudflare). They
#   only carry the photo credit links on blog posts, which load in a browser.
# - LinkedIn share links redirect logged-out visitors to its login page, which
#   Cloudflare intermittently answers with 403 for CI runners. A pass says
#   little anyway: any url= value and near-miss paths reach that page too. Only
#   these are excluded: lychee gets a real 404 for a wrong company page.
exclude = [
  "ico\\.org\\.uk",
  "unsplash\\.com",
  "pexels\\.com",
  "linkedin\\.com/sharing/",
]
