[tools]
deno = "2.9.8"
lychee = "0.24.2"
node = "26.13.1"
pnpm = "12.20.0"

[env]
_.path = ['./node_modules/.bin']

[hooks]
# `mise install` points git at the tracked hooks in .githooks/, whose
# post-checkout renders the shared rules into each new worktree. Not a pnpm
# `prepare` script: the global pnpm config sets ignoreScripts, so it never runs.
# This repo-level setting takes precedence over any global core.hooksPath.
# `|| true` keeps `mise install` working where the tree is not a git checkout.
postinstall = "git config core.hooksPath .githooks || true"
